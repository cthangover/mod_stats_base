collection_settings/player = Nhân vật người chơi
collection_settings/player_hint = Nhân vật đại diện cho player trong chỉ số và kiểm tra. Chọn mẫu hoặc nhập ID được tạo khi chơi.
collection_settings/player_auto = Nếu không đặt: thành viên đầu đội chiến đấu, hoặc player nếu không có đội.
collection_settings/player_group = Nhân vật
